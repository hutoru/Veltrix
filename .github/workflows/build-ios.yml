name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      task:
        description: Build the Release IPA or run a simulator test suite
        type: choice
        options:
          - release_with_tests
          - release_with_live_activity_test
          - release
          - tests
          - unit_tests
          - visual_smoke
        default: release

permissions:
  contents: read

concurrency:
  group: veltrix-ios-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

jobs:
  release:
    needs: tests
    if: ${{ !cancelled() && (inputs.task == 'release' || ((inputs.task == 'release_with_tests' || inputs.task == 'release_with_live_activity_test') && needs.tests.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Select Xcode and generate project
        shell: bash
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_16.4.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen generate --spec project.yml

      - name: Build and validate unsigned ARM64 IPA
        run: bash scripts/build-ipa.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Veltrix-unsigned-ipa
          path: |
            build/VELTRIX-*-Experience.ipa
            build/VELTRIX-*-Experience.ipa.sha256
          if-no-files-found: error
          retention-days: 7

  tests:
    if: ${{ inputs.task != 'release' }}
    uses: ./.github/workflows/test-ios.yml
    with:
      scope: ${{ inputs.task == 'release_with_tests' && 'tests' || inputs.task == 'release_with_live_activity_test' && 'live_activity' || inputs.task }}

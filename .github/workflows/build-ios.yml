name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      task:
        description: Build the Release IPA or run the full or unit-only simulator suite
        type: choice
        options:
          - release
          - tests
          - unit_tests
        default: release

permissions:
  contents: read

concurrency:
  group: veltrix-ios-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ inputs.task == 'release' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Select Xcode and generate project
        shell: bash
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_16.4.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcodegen --version
          xcrun --sdk iphoneos --show-sdk-version
          xcodegen generate --spec project.yml

      - name: Build and validate unsigned ARM64 IPA
        run: bash scripts/build-ipa.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Veltrix-unsigned-ipa
          path: |
            build/Veltrix.ipa
            build/Veltrix.ipa.sha256
          if-no-files-found: error
          retention-days: 7

  tests:
    if: ${{ inputs.task == 'tests' || inputs.task == 'unit_tests' }}
    uses: ./.github/workflows/test-ios.yml
    with:
      unit_only: ${{ inputs.task == 'unit_tests' }}

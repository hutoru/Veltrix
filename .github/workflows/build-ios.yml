name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [veltrix-8.1-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: veltrix-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


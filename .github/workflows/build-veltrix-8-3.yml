name: Build Veltrix 8.3.0

on:
  push:
    branches: [veltrix-8.3-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source-8.3
    steps:
      - uses: actions/checkout@v6
      - name: Extract uploaded sources
        working-directory: .
        run: unzip -q veltrix-8.3.0-build-input.zip -d source-8.3
      - name: Set up Xcode
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_16.4.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Build and verify iOS ARM64 IPA
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Veltrix-8.3.0-unsigned-ipa
          path: |
            source-8.3/build/Veltrix.ipa
            source-8.3/build/Veltrix.ipa.sha256
          if-no-files-found: error
      - name: Run iOS simulator tests
        run: |
          set -euo pipefail
          simulator="$(bash scripts/select-simulator.sh)"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcodebuild test -project Veltrix.xcodeproj -scheme Veltrix \
            -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath build/TestDerived -resultBundlePath build/VeltrixTests.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/VeltrixTests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/VeltrixTests.xcresult --output-path build/SimulatorAttachments
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Veltrix-8.3.0-test-results
          path: |
            source-8.3/build/VeltrixTests.xcresult
            source-8.3/build/SimulatorAttachments
          if-no-files-found: ignore

name: Veltrix
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: false
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: "9.3.0"
targets:
  Veltrix:
    type: application
    platform: iOS
    sources:
      - path: Veltrix
        excludes:
          - Resources/Info.plist
      - path: Shared
        excludes: ["*.entitlements"]
    dependencies:
      - target: VeltrixWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veltrix.simulation
        PRODUCT_NAME: Veltrix
        INFOPLIST_FILE: Veltrix/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "VXWhite VXMidnight VXTitanium VXCarbon VXGold VXOcean VXMono"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Shared/WidgetGroup.entitlements
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "ARCHS[sdk=iphoneos*]": arm64
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  VeltrixWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VeltrixWidgets
        excludes: [Info.plist]
      - path: Shared
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veltrix.simulation.widgets
        INFOPLIST_FILE: VeltrixWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/WidgetGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: YES
        "ARCHS[sdk=iphoneos*]": arm64
  VeltrixUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.veltrix.simulation.tests
    dependencies:
      - target: Veltrix
  VeltrixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.veltrix.simulation.uitests
        TEST_TARGET_NAME: Veltrix
    dependencies:
      - target: Veltrix
schemes:
  Veltrix:
    build:
      targets:
        Veltrix: all
        VeltrixUnitTests: [test]
        VeltrixUITests: [test]
    test:
      config: Debug
      targets:
        - VeltrixUnitTests
        - VeltrixUITests
    run:
      config: Debug
    archive:
      config: Release
